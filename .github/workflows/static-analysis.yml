# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Static Analysis check"

on:
  pull_request:
  push:
    branches:
      - "master"
      - "development"
      - "test"
      - "gravitypdf"

jobs:

  stan:

    name: "Static Analysis check"

    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        php-version:
          - "8.2"
          - "8.5"

        operating-system: [ubuntu-latest]

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          extensions: "mbstring"
          tools: composer:v2

      - name: "Locate Composer cache"
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: "Cache Composer downloads"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "composer-${{ runner.os }}-php${{ matrix.php-version }}-phpstan-${{ hashFiles('composer.json') }}"
          restore-keys: "composer-${{ runner.os }}-php${{ matrix.php-version }}-phpstan-"

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress && composer require \"phpstan/phpstan:^2.0\""

      - name: "Static Analysis check"
        run: vendor/bin/phpstan --no-progress
