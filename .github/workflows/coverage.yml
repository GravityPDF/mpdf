# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Code coverage"

on:
  push:
    branches:
      - "development"
      - "coverage"

jobs:

  coverage:

    name: "Code coverage"

    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        php-version:
          - "7.4"

        operating-system: [ubuntu-latest]

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "xdebug"
          php-version: "${{ matrix.php-version }}"
          extensions: "mbstring, gd, bcmath, bz2, fileinfo"
          tools: composer:v2

      - name: "Locate Composer cache"
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: "Cache Composer downloads"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "composer-${{ runner.os }}-php${{ matrix.php-version }}-font-bundle-lite-${{ hashFiles('composer.json') }}"
          restore-keys: "composer-${{ runner.os }}-php${{ matrix.php-version }}-font-bundle-lite-"

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Install fonts"
        run: "composer require mpdf/font-bundle-lite --no-interaction --no-progress"

      - name: "Code coverage"
        run: composer coverage
