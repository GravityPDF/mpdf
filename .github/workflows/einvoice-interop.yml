# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "E-invoice interop"

on:
  # Pull requests run this only when they change one of these paths
  pull_request:
    paths:
      - ".github/workflows/einvoice-interop.yml"
      - "composer.json"
      - "phpunit.xml"
      - "src/Invoice/**"
      - "src/Pdf/**"
      - "src/Utils/**"
      - "src/Writer/**"
      - "src/Xmp/**"
      - "tests/Mpdf/Invoice/**"
      - "tests/Mpdf/InteropPackage.php"
      - "tests/Mpdf/InvoiceFixtures.php"
      - "tests/Mpdf/PageStreams.php"
      - "tests/data/invoice/**"
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "development"
      - "test"
      - "gravitypdf"

# A push to a pull request cancels the run it replaces. Other events run in a group of their own
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}"
  cancel-in-progress: true

jobs:

  interop:

    name: "E-invoice interop"

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The packages need PHP 7.3 (horstoeko/zugferd) and 8.3 (easybill/e-invoicing), so they are installed here rather
        # than in require-dev, each on the versions it supports
        include:
          - php-version: "7.3"
            packages: "horstoeko/zugferd"
          - php-version: "8.5"
            packages: "horstoeko/zugferd easybill/e-invoicing"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          extensions: "mbstring, gd, fileinfo, zip"
          tools: composer:v2
          ini-values: error_reporting=-1

      - name: "Locate Composer cache"
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: "Cache Composer downloads"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "composer-${{ runner.os }}-php${{ matrix.php-version }}-einvoice-${{ hashFiles('composer.json') }}"
          restore-keys: "composer-${{ runner.os }}-php${{ matrix.php-version }}-einvoice-"

      - name: "Install dependencies"
        run: "composer require --dev ${{ matrix.packages }} --no-update && composer install --no-interaction --no-progress"

      - name: "Tests"
        run: composer test -- --group=interop
        env:
          # A test whose package is named here fails, rather than skips, when the package is missing
          EINVOICE_INTEROP: "${{ matrix.packages }}"
