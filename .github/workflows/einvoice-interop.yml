# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "E-invoice interop"

on:
  pull_request:
  push:
    branches:
      - "master"
      - "development"
      - "test"
      - "gravitypdf"

jobs:

  interop:

    name: "E-invoice interop"

    runs-on: ${{ matrix.operating-system }}

    strategy:
      fail-fast: false
      matrix:
        # The packages need PHP 7.3 (horstoeko/zugferd) and 8.3 (easybill/e-invoicing), so they are installed here rather
        # than in require-dev, each on the versions it supports
        include:
          - php-version: "7.3"
            operating-system: "ubuntu-latest"
            packages: "horstoeko/zugferd"
          - php-version: "8.5"
            operating-system: "ubuntu-latest"
            packages: "horstoeko/zugferd easybill/e-invoicing"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          extensions: "mbstring, gd, fileinfo, zip"
          tools: composer:v2
          ini-values: error_reporting=-1

      - name: "Locate Composer cache"
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: "Cache Composer downloads"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "composer-${{ runner.os }}-php${{ matrix.php-version }}-einvoice-${{ hashFiles('composer.json') }}"
          restore-keys: "composer-${{ runner.os }}-php${{ matrix.php-version }}-einvoice-"

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress && composer require --dev ${{ matrix.packages }} --no-interaction --no-progress"

      - name: "Tests"
        run: composer test -- --group=interop
        env:
          # Fails the tests rather than skipping them if the packages did not install
          EINVOICE_INTEROP: "1"
