# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Tests"

on:
  pull_request:
  push:
    branches:
      - "master"
      - "development"
      - "test"
      - "gravitypdf"

jobs:

  tests:

    name: "Tests"

    runs-on: ${{ matrix.operating-system }}

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "5.6"
          - "7.0"
          - "7.1"
          - "7.2"
          - "7.3"
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        operating-system: [ubuntu-latest, windows-latest]

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          extensions: "mbstring, gd, bcmath, bz2, fileinfo"
          tools: composer:v2
          ini-values: error_reporting=-1

      - name: "Locate Composer cache"
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: "Cache Composer downloads"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "composer-${{ runner.os }}-php${{ matrix.php-version }}-font-bundle-lite-${{ hashFiles('composer.json') }}"
          restore-keys: "composer-${{ runner.os }}-php${{ matrix.php-version }}-font-bundle-lite-"

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Install fonts"
        run: "composer require mpdf/font-bundle-lite --no-interaction --no-progress"

      - name: "Tests"
        run: composer test

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: "phpunit-artifact-${{ matrix.php-version }}-${{ matrix.operating-system }}"
          path: tmp/artifacts/
          if-no-files-found: ignore
