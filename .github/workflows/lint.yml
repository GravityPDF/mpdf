# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Lint"

on:
  pull_request:
  push:
    branches:
      - "master"
      - "development"
      - "test"
      - "gravitypdf"
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

# A push to a pull request cancels the run it replaces. Other events run in a group of their own
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}"
  cancel-in-progress: true

jobs:

  lint:

    name: "Lint"

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # PHPStan reports differ between PHP versions, so it runs on both
        php-version:
          - "8.2"
          - "8.5"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          extensions: "mbstring"
          tools: composer:v2

      - name: "Locate Composer cache"
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: "Cache Composer downloads"
        uses: "actions/cache@v6"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "composer-${{ runner.os }}-php${{ matrix.php-version }}-phpstan-${{ hashFiles('composer.json') }}"
          restore-keys: "composer-${{ runner.os }}-php${{ matrix.php-version }}-phpstan-"

      - name: "Install dependencies"
        id: install
        run: "composer require \"phpstan/phpstan:^2.0\" --no-update && composer install --no-interaction --no-progress"

      - name: "Coding standard"
        if: matrix.php-version == '8.2'
        run: composer cs

      - name: "Static analysis"
        if: "!cancelled() && steps.install.outcome == 'success'"
        run: vendor/bin/phpstan --no-progress
